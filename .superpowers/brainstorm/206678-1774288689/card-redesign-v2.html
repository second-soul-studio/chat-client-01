<h2>Card Interaction Redesign</h2>
<p class="subtitle">Hamburger-Button jetzt gleich breit wie früher "talk"</p>

<div class="section" style="display:flex;gap:40px;justify-content:center;flex-wrap:wrap;align-items:flex-start;margin-top:24px">

  <div style="text-align:center">
    <div class="label" style="margin-bottom:12px;color:#C9A96E">NEU (angepasst)</div>
    <div style="width:200px;height:280px;border-radius:24px;background:linear-gradient(135deg,#1a1228 0%,#0d0a1a 100%);border:1px solid rgba(201,169,110,0.4);position:relative;overflow:visible;cursor:pointer;box-shadow:0 30px 60px rgba(0,0,0,0.6),0 0 40px rgba(201,169,110,0.12)">
      <div style="position:absolute;inset:-20px;border-radius:50%;background:radial-gradient(circle,rgba(201,169,110,0.1) 0%,transparent 70%);pointer-events:none"></div>
      <div style="position:absolute;top:36px;left:50%;transform:translateX(-50%);width:90px;height:90px;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(201,169,110,0.27) 0%,rgba(201,169,110,0.07) 60%,transparent 100%);border:2px solid rgba(201,169,110,0.34);display:flex;align-items:center;justify-content:center;font-size:36px;font-family:Georgia,serif;color:#C9A96E">A</div>
      <div style="position:absolute;bottom:72px;left:0;right:0;text-align:center;padding:0 16px">
        <div style="font-size:22px;font-family:Georgia,serif;color:#fff">Aria</div>
        <div style="font-size:10px;color:#C9A96E;letter-spacing:0.2em;text-transform:uppercase;font-family:monospace;margin-top:4px;opacity:0.8">your muse</div>
      </div>
      <!-- Hamburger button — same width as old TALK (padding 8px 28px) -->
      <div style="position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(201,169,110,0.14);border:1px solid rgba(201,169,110,0.4);border-radius:20px;padding:8px 28px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;white-space:nowrap">
        <div style="width:18px;height:1.5px;background:#C9A96E;border-radius:2px"></div>
        <div style="width:18px;height:1.5px;background:#C9A96E;border-radius:2px"></div>
        <div style="width:18px;height:1.5px;background:#C9A96E;border-radius:2px"></div>
      </div>
      <div style="position:absolute;top:8px;left:8px;font-size:9px;background:rgba(0,0,0,0.5);color:rgba(255,255,255,0.5);border-radius:6px;padding:2px 6px;font-family:monospace">Klick → Chat</div>
    </div>
    <div style="margin-top:12px;font-size:11px;color:rgba(255,255,255,0.35);font-family:monospace;max-width:200px;line-height:1.5">
      Gleiche Breite wie alter "talk"-Button<br>Hamburger-Symbol zentriert
    </div>
  </div>

</div>

<div class="section" style="margin-top:32px;max-width:480px;margin-left:auto;margin-right:auto">
  <div class="options">
    <div class="option" data-choice="approve" onclick="toggleSelect(this)">
      <div class="letter">✓</div>
      <div class="content">
        <h3>Perfekt, weiter</h3>
        <p>Design ist abgesegnet</p>
      </div>
    </div>
    <div class="option" data-choice="tweak" onclick="toggleSelect(this)">
      <div class="letter">~</div>
      <div class="content">
        <h3>Noch eine Änderung</h3>
        <p>Fast, aber nicht ganz</p>
      </div>
    </div>
  </div>
</div>
